name: validate
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  specifications:
    name: Validate specifications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0.0.9
        with:
          pkl-version: 0.32.1
      - run: ./scripts/check.sh
      - run: python3 scripts/build_mcs.py
      - name: Upload MCS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcs-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#vendor/**"
